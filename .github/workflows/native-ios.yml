name: 打包 iOS App（手動觸發，正式簽署版）

# 用 GitHub 提供的 macOS 虛擬機跑，你自己不需要有 Mac。用 Apple Distribution 憑證 +
# Provisioning Profile 正式簽署，打包、簽署、上傳 TestFlight 一次跑完，不需要 Mac 上的
# Transporter App 手動上傳。
#
# 前提：SETUP.md「iOS 正式簽署」那節的六個 GitHub Secrets 要先設定好：
#   IOS_DIST_CERT_P12、IOS_DIST_CERT_PASSWORD、IOS_PROVISION_PROFILE、
#   ASC_API_KEY_P8、ASC_API_KEY_ID、ASC_API_ISSUER_ID
# 沒設定的話這個流程會在對應那一步直接失敗並告訴你原因，不會打包出一個不能用的版本。
#
# 平常改網頁內容不用重跑這個：App 現在是把網頁內容整個包進 App 本體（離線也打得開），
# 靠的是內建的空中更新機制，開啟時自己檢查、悄悄下載套用最新網頁內容（見 lib/otaUpdate.js），
# 不用使用者重新下載安裝。只有動到 App 本身設定（圖示、原生外掛、capacitor.config.json）才需要重跑。

on:
  workflow_dispatch:

env:
  BUNDLE_ID: io.github.ahatrip.tripplanner
  TEAM_ID: V63W46G4GP
  PROFILE_NAME: ZouLa App Store

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝打包工具（esbuild、Capacitor）
        run: npm install

      - name: 打包網頁版（這份輸出會整個包進 App 本體，也會順便產生空中更新包）
        run: npm run build

      - name: 第一次執行要先建立 ios/ 專案資料夾
        run: |
          if [ ! -d ios ]; then
            # 這個指令最後會自動順便跑一次 pod install，但這時候 Podfile 裡的 iOS 最低版本
            # 還是 Capacitor 的預設值，裝不下空中更新套件要求的版本，一定會失敗——沒關係，
            # 專案本身（Podfile 等檔案）已經建立好了，下面會先調整版本需求，再正式跑一次 pod install
            npx cap add ios || true
          fi

      - name: 空中更新套件需要比較新的 iOS 版本，調整 Podfile 的最低版本需求
        run: |
          sed -i '' "s/platform :ios, '.*'/platform :ios, '14.0'/" ios/App/Podfile
          grep "platform :ios" ios/App/Podfile

      - name: 用 icon.png / splash.png 產生各種尺寸的 App 圖示與啟動畫面
        run: npx @capacitor/assets generate --ios --assetPath resources

      # 跟 Android 那份一樣，要先照 SETUP.md 到 Firebase Console 設定好、把檔案存成
      # native-config/GoogleService-Info.plist 放進這個 repo，這裡才會幫你接上去；
      # 沒放這個檔案，App 一樣會打包成功，只是 Google 登入在 App 裡不會動。
      - name: 接上 GoogleService-Info.plist（已經照 SETUP.md 設定好才會生效，沒設定也不會讓打包失敗）
        run: |
          if [ -f native-config/GoogleService-Info.plist ]; then
            cp native-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
            # Google 登入在 iOS 上需要把這組「反過來寫的用戶端 ID」登記成 App 的網址格式（URL Scheme），
            # 登入視窗跳轉回 App 時系統才知道要交給誰 —— 直接從 plist 裡讀出來，不用手動填
            REVERSED_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" native-config/GoogleService-Info.plist)
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/App/App/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED_ID" ios/App/App/Info.plist
            echo "已接上 GoogleService-Info.plist，Google 登入會是完整版本"
          else
            echo "::warning::還沒有 native-config/GoogleService-Info.plist，這次打包的 App 裡 Google 登入會沒有作用（其他功能都正常），照 SETUP.md 設定好再重新打包一次即可"
          fi

      - name: 把設定（capacitor.config.json）同步進 ios 專案
        run: npx cap sync ios

      - name: 安裝 CocoaPods 相依套件
        working-directory: ios/App
        run: pod install

      # 匯入 Apple Distribution 憑證到一個這次執行專用的暫時 keychain，跑完這次 CI 就不留痕跡，
      # 不會跟 GitHub 代管機器上其他東西混在一起。
      - name: 匯入簽署憑證
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$IOS_DIST_CERT_P12" ] || [ -z "$IOS_DIST_CERT_PASSWORD" ]; then
            echo "::error::還沒設定 IOS_DIST_CERT_P12 / IOS_DIST_CERT_PASSWORD 這兩個 GitHub Secret，照 SETUP.md「iOS 正式簽署」那節設定好才能打包簽署版。"
            exit 1
          fi
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$IOS_DIST_CERT_P12" | base64 --decode > $RUNNER_TEMP/dist_cert.p12
          # 除錯用，之後要拿掉：只印出雜湊值/長度，不會洩漏任何密碼或憑證內容本身，
          # 用來比對 GitHub Secret 裡貼的內容是不是跟本機原始檔案一致
          echo "解碼後的 p12 檔案 SHA256（應該要是 ca12c286e10d3e6c4e638d22139bb8993c5c1338f08bfa4d2c913b5f606239e1）："
          shasum -a 256 $RUNNER_TEMP/dist_cert.p12
          echo "密碼字串長度（應該要是 24）：${#IOS_DIST_CERT_PASSWORD}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import $RUNNER_TEMP/dist_cert.p12 -k build.keychain -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

      - name: 安裝 Provisioning Profile
        env:
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          if [ -z "$IOS_PROVISION_PROFILE" ]; then
            echo "::error::還沒設定 IOS_PROVISION_PROFILE 這個 GitHub Secret，照 SETUP.md「iOS 正式簽署」那節設定好才能打包簽署版。"
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          security cms -D -i $RUNNER_TEMP/profile.mobileprovision > $RUNNER_TEMP/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/profile.plist)
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: 封存（archive）
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: 匯出 .ipa
        working-directory: ios/App
        run: |
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export -exportOptionsPlist exportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: zoula-ios-release
          path: ios/App/build/export/*.ipa

      # 自動上傳到 TestFlight：用 App Store Connect API Key（SETUP.md「iOS 正式簽署」那節），
      # 不需要 Mac、不需要 Transporter，CI 整個流程跑完就直接進 TestFlight。
      - name: 上傳到 TestFlight
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ] || [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ]; then
            echo "::error::還沒設定 ASC_API_KEY_P8 / ASC_API_KEY_ID / ASC_API_ISSUER_ID 這三個 GitHub Secret，照 SETUP.md「iOS 正式簽署」那節設定好才能自動上傳 TestFlight（.ipa 還是有打包成功，只是這步會失敗，可以到 Artifacts 手動下載）。"
            exit 1
          fi
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_API_KEY_ID.p8
          IPA_PATH=$(find ios/App/build/export -name "*.ipa" | head -n 1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"

      # 跑完之後：幾分鐘內 App Store Connect 的 TestFlight 分頁就會看到這個新版本
      # （Apple 伺服器端處理需要一點時間，不是上傳完馬上出現）。
