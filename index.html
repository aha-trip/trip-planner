  <style>
    /* 手機上輸入框字體小於 16px，iOS Safari 會在點進去時自動放大整個頁面，很干擾，所以統一至少 16px */
    @media (max-width: 640px) { input, select, textarea { font-size: 16px !important; } }
    button, a { -webkit-tap-highlight-color: transparent; }
  </style>
  <script>
    // 離線功能（Service Worker）已經拿掉了：它會快取整個網站，導致「重新整理」不保證拿到最新版本，
    // 使用者得知道要強制重新整理/清快取才行，這對一般人不合理。這段程式碼永久留著當保險——
    // 如果有人的瀏覽器之前裝過舊版的 Service Worker，之後每次打開都會被這段自動解除安裝、
    // 清掉快取，確保任何裝置、任何時候重新整理都一定是最新版本。
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (names) {
        names.forEach(function (n) { caches.delete(n); });
      });
    }
  </script>
